<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birr Watch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <h1 class="logo-title">Birr Watch</h1>

        <button
          id="theme-toggle"
          class="btn-theme-toggle"
          aria-label="Toggle dark/light theme"
        >
          <svg
            class="icon-sun"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg
            class="icon-moon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </header>

      <main class="main-content">
        <div id="status-box" class="status-box hidden">
          <svg
            class="status-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <div class="status-text-wrapper">
            <strong id="status-title">Rate Load Failed</strong>
            <p id="status">Loading rates…</p>
          </div>
        </div>

        <div class="desktop-grid">
          <div class="converter-column">
            <div class="card form-card">
              <form id="convert-form">
                <div class="form-group">
                  <label for="amount">Amount</label>
                  <div class="input-badge-wrapper">
                    <span class="badge-etb">ETB</span>
                    <input id="amount" type="number" value="100" step="0.01" />
                  </div>
                </div>

                <div class="form-group">
                  <label for="currency">To Currency</label>
                  <div class="select-wrapper">
                    <select id="currency"></select>
                  </div>
                </div>

                <button type="submit" class="btn-convert">
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"
                    />
                  </svg>
                  <span>Convert</span>
                </button>
              </form>
            </div>

            <div class="result-card">
              <p id="result"></p>
            </div>
          </div>

          <section class="watchlist-section">
            <h2>Watchlist</h2>
            <hr class="divider" />
            <ul id="watchlist"></ul>
          </section>
        </div>
      </main>

      <footer class="app-footer">
        <h3 class="footer-title">Birr Watch</h3>
        <p class="copyright">© 2026 Birr Watch.</p>

        <nav class="footer-links">
          <a href="#">Terms of Service</a>
          <a href="#">Privacy Policy</a>
          <a href="#">Contact Support</a>
        </nav>
      </footer>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
