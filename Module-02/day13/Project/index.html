<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <meta
      name="description"
      content="Business profile card for a fictional Addis Ababa business."
    />
    <title>Bole Coffee | Business Profile</title>
  </head>
  <body>
    <main>
      <section class="card">
        <img
          src="./images/coffe shop-unsplash.jpg"
          width="300px"
          alt="Front view of Bole Coffee shop"
        />

        <h1>Bole Coffee</h1>

        <p class="tagline">Authentic Ethiopian Coffee & Fresh Pastries</p>
        <p class="description">
          Located in the heart of Bole, we proudly serve freshly roasted
          Ethiopian coffee, homemade pastries, and traditional breakfast every
          day.
        </p>

        <button class="btn">Contact Us</button>
      </section>
    </main>
  </body>
</html>
