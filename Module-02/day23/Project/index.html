<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Order authentic Ethiopian food online from Addis Eats in Bole, Addis Ababa. Fast delivery for Doro Wat, Shiro, Kitfo, and vegan fasting dishes."
    />
    <title>Addis Eats</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
    <header
      class="bg-white border-b border-gray-200 sticky top-0 z-10 px-4 py-3 flex flex-wrap items-center justify-between gap-4 shadow-sm"
    >
      <h1 class="text-2xl font-bold text-emerald-800">🍴 Addis Eats</h1>

      <div class="flex-1 max-w-md">
        <input
          type="search"
          id="search"
          placeholder="Search injera, wot, breakfast..."
          aria-label="Search dishes"
          class="w-full px-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-emerald-600 text-sm"
        />
      </div>

      <div class="flex items-center gap-3">
        <button
          id="cart-btn"
          aria-label="View Cart"
          class="flex items-center gap-2 bg-emerald-50 text-emerald-800 px-3 py-2 rounded-lg font-medium hover:bg-emerald-100 transition"
        >
          🛒 <span>Cart</span>
          <span
            id="cart-badge"
            class="bg-emerald-700 text-white text-xs px-2 py-0.5 rounded-full"
            >3</span
          >
        </button>
        <button
          id="theme-toggle"
          aria-label="Toggle dark mode"
          class="p-2 border border-gray-300 rounded-lg hover:bg-gray-100"
        >
          🌙
        </button>
      </div>
    </header>

    <main
      class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6"
    >
      <section
        id="menu-section"
        aria-label="Restaurant Menu"
        class="lg:col-span-2 space-y-4"
      >
        <nav
          id="category-filters"
          aria-label="Filter dishes by category"
          class="flex gap-2 overflow-x-auto pb-2"
        >
          <button
            class="filter-btn bg-emerald-700 text-white px-4 py-1.5 rounded-full text-sm font-medium"
            data-category="All"
          >
            All
          </button>
          <button
            class="filter-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-300"
            data-category="Main"
          >
            Main
          </button>
          <button
            class="filter-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-300"
            data-category="Vegetarian"
          >
            Vegetarian
          </button>
          <button
            class="filter-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-300"
            data-category="Breakfast"
          >
            Breakfast
          </button>
          <button
            class="filter-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-300"
            data-category="Side"
          >
            Side
          </button>
        </nav>

        <div id="menu" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <article
            class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm flex flex-col justify-between"
          >
            <div>
              <img
                src="Image/doro-wat.jpg"
                alt="Doro Wat"
                class="w-full h-48 object-cover bg-gray-200"
              />
              <div class="p-4 space-y-2">
                <div class="flex items-center justify-between">
                  <span
                    class="text-xs bg-amber-100 text-amber-800 font-semibold px-2.5 py-0.5 rounded-full"
                    >Main</span
                  >
                  <span
                    class="text-xs bg-red-100 text-red-700 font-semibold px-2 py-0.5 rounded-full"
                    >🌶️ Spicy</span
                  >
                </div>
                <h3 class="text-lg font-bold text-gray-900">Doro Wat</h3>
                <p class="text-emerald-700 font-bold text-base">240 ETB</p>
              </div>
            </div>
            <div class="p-4 pt-0">
              <button
                class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-2 rounded-lg font-medium transition"
              >
                Add to Cart
              </button>
            </div>
          </article>

          <article
            class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm flex flex-col justify-between"
          >
            <div>
              <img
                src="Image/shiro-wat.jpg"
                alt="Shiro"
                class="w-full h-48 object-cover bg-gray-200"
              />
              <div class="p-4 space-y-2">
                <div class="flex items-center justify-between">
                  <span
                    class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-0.5 rounded-full"
                    >Vegetarian</span
                  >
                  <span
                    class="text-xs bg-gray-100 text-gray-600 font-semibold px-2 py-0.5 rounded-full"
                    >Mild</span
                  >
                </div>
                <h3 class="text-lg font-bold text-gray-900">Shiro</h3>
                <p class="text-emerald-700 font-bold text-base">120 ETB</p>
              </div>
            </div>
            <div class="p-4 pt-0">
              <button
                class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-2 rounded-lg font-medium transition"
              >
                Add to Cart
              </button>
            </div>
          </article>

          <article
            class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm flex flex-col justify-between"
          >
            <div>
              <img
                src="Image/beyaynet.jpg"
                alt="Shiro"
                class="w-full h-48 object-cover bg-gray-200"
              />
              <div class="p-4 space-y-2">
                <div class="flex items-center justify-between">
                  <span
                    class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-0.5 rounded-full"
                    >Vegetarian</span
                  >
                  <span
                    class="text-xs bg-gray-100 text-gray-600 font-semibold px-2 py-0.5 rounded-full"
                    >Mild</span
                  >
                </div>
                <h3 class="text-lg font-bold text-gray-900">Shiro</h3>
                <p class="text-emerald-700 font-bold text-base">120 ETB</p>
              </div>
            </div>
            <div class="p-4 pt-0">
              <button
                class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-2 rounded-lg font-medium transition"
              >
                Add to Cart
              </button>
            </div>
          </article>
        </div>
      </section>

      <aside
        id="cart-panel"
        aria-label="Your Order"
        class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm h-fit sticky top-20 space-y-4"
      >
        <h2 class="text-xl font-bold border-b border-gray-200 pb-2">
          Your Order
        </h2>

        <div id="cart-items" class="space-y-3 max-h-60 overflow-y-auto">
          <div
            class="flex items-center justify-between border-b border-gray-100 pb-2"
          >
            <div>
              <p class="font-semibold text-sm">Doro Wat</p>
              <p class="text-xs text-gray-500">240 ETB</p>
            </div>
            <div class="flex items-center gap-2">
              <button
                class="px-2 py-0.5 bg-gray-100 rounded hover:bg-gray-200 font-bold text-sm"
              >
                -
              </button>
              <span class="text-sm font-semibold">1</span>
              <button
                class="px-2 py-0.5 bg-gray-100 rounded hover:bg-gray-200 font-bold text-sm"
              >
                +
              </button>
              <button
                class="text-red-500 hover:text-red-700 text-sm ml-1"
                aria-label="Remove item"
              >
                🗑️
              </button>
            </div>
          </div>

          <div
            class="flex items-center justify-between border-b border-gray-100 pb-2"
          >
            <div>
              <p class="font-semibold text-sm">Shiro</p>
              <p class="text-xs text-gray-500">120 ETB</p>
            </div>
            <div class="flex items-center gap-2">
              <button
                class="px-2 py-0.5 bg-gray-100 rounded hover:bg-gray-200 font-bold text-sm"
              >
                -
              </button>
              <span class="text-sm font-semibold">1</span>
              <button
                class="px-2 py-0.5 bg-gray-100 rounded hover:bg-gray-200 font-bold text-sm"
              >
                +
              </button>
              <button
                class="text-red-500 hover:text-red-700 text-sm ml-1"
                aria-label="Remove item"
              >
                🗑️
              </button>
            </div>
          </div>

          <div
            class="flex items-center justify-between border-b border-gray-100 pb-2"
          >
            <div>
              <p class="font-semibold text-sm">Beyaynet</p>
              <p class="text-xs text-gray-500">150 ETB</p>
            </div>
            <div class="flex items-center gap-2">
              <button
                class="px-2 py-0.5 bg-gray-100 rounded hover:bg-gray-200 font-bold text-sm"
              >
                -
              </button>
              <span class="text-sm font-semibold">1</span>
              <button
                class="px-2 py-0.5 bg-gray-100 rounded hover:bg-gray-200 font-bold text-sm"
              >
                +
              </button>
              <button
                class="text-red-500 hover:text-red-700 text-sm ml-1"
                aria-label="Remove item"
              >
                🗑️
              </button>
            </div>
          </div>
        </div>

        <div class="cart-summary border-t border-gray-200 pt-3 space-y-3">
          <div class="flex justify-between items-center text-lg">
            <span>Total:</span>
            <strong id="cart-total" class="text-emerald-700 font-bold"
              >510 ETB</strong
            >
          </div>
          <button
            id="checkout-btn"
            class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2.5 rounded-lg transition"
          >
            Checkout
          </button>
        </div>
      </aside>
    </main>

    <footer
      class="bg-white border-t border-gray-200 py-4 text-center text-sm text-gray-500"
    >
      <p>Bole, Addis Ababa | &copy; 2026 Addis Eats</p>
      <div class="mt-2 space-x-4">
        <a href="#" class="hover:underline">Terms</a>
        <a href="#" class="hover:underline">Privacy</a>
        <a href="#" class="hover:underline">Contact</a>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
