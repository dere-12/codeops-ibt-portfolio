<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Order authentic Ethiopian food online from Addis Eats in Bole, Addis Ababa. Fast delivery for Doro Wat, Shiro, Kitfo, and vegan fasting dishes."
    />
    <title>Addis Eats</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
    <header
      class="bg-white border-b border-gray-200 sticky top-0 z-10 px-4 py-3 flex flex-wrap items-center justify-between gap-4 shadow-sm"
    >
      <h1 class="text-2xl font-bold text-emerald-800 cursor-pointer">
        🍴 Addis Eats
      </h1>

      <div class="flex-1 max-w-md">
        <input
          type="search"
          id="search"
          placeholder="Search shiro, doro wat..."
          aria-label="Search dishes"
          class="w-full px-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-emerald-600 text-sm"
        />
      </div>

      <div class="mx-8">
        <button
          id="cart-btn"
          aria-label="View Cart"
          class="flex items-center gap-2 bg-emerald-50 text-emerald-800 px-3 py-2 rounded-lg font-medium hover:bg-emerald-100 transition"
        >
          🛒 <span>Cart</span>
          <span
            id="cart-badge"
            class="bg-emerald-700 text-white text-xs px-2 py-0.5 rounded-full"
            >3</span
          >
        </button>
      </div>
    </header>

    <main
      class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6"
    >
      <section
        id="menu-section"
        aria-label="Restaurant Menu"
        class="lg:col-span-2 space-y-4"
      >
        <nav
          id="category-filters"
          aria-label="Filter dishes by category"
          class="flex gap-2 overflow-x-auto pb-2"
        >
          <button
            class="filter-btn bg-emerald-700 text-white px-4 py-1.5 rounded-full text-sm font-medium"
            data-category="All"
          >
            All
          </button>
          <button
            class="filter-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-300"
            data-category="Main"
          >
            Main
          </button>
          <button
            class="filter-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-300"
            data-category="Vegetarian"
          >
            Vegetarian
          </button>
          <button
            class="filter-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-300"
            data-category="Breakfast"
          >
            Breakfast
          </button>
          <button
            class="filter-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-300"
            data-category="Side"
          >
            Side
          </button>
        </nav>

        <div id="menu" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </section>

      <aside
        id="cart-panel"
        aria-label="Your Order"
        class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm h-fit sticky top-20 space-y-4"
      >
        <h2 class="text-xl font-bold border-b border-gray-200 pb-2">
          Your Order
        </h2>

        <div id="cart-items" class="space-y-3 max-h-60 overflow-y-auto"></div>

        <div class="cart-summary border-t border-gray-200 pt-3 space-y-3">
          <div class="flex justify-between items-center text-lg">
            <span class="font-bold">Total:</span>
            <strong id="cart-total" class="text-emerald-700 font-bold"
              >0 ETB</strong
            >
          </div>

          <form
            id="checkout-form"
            novalidate
            class="space-y-3 pt-2 border-t border-gray-100"
          >
            <label class="block text-xs font-semibold text-gray-700">
              Full Name
              <input
                type="text"
                id="name"
                required
                placeholder="Abel Tesfaye"
                class="w-full mt-1 px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600"
              />
            </label>

            <label class="block text-xs font-semibold text-gray-700">
              Phone (TeleBirr)
              <input
                type="tel"
                id="phone"
                placeholder="0911234567 or +251911234567"
                class="w-full mt-1 px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600"
              />
            </label>

            <label class="block text-xs font-semibold text-gray-700">
              Delivery Area
              <select
                id="area"
                class="w-full mt-1 px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 bg-white"
              >
                <option value="Bole">Bole</option>
                <option value="Kazanchis">Kazanchis</option>
                <option value="Megenagna">Megenagna</option>
              </select>
            </label>

            <p
              id="form-error"
              aria-live="polite"
              class="text-xs text-red-600 font-medium min-h-[1rem]"
            ></p>

            <button
              type="submit"
              class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2.5 rounded-lg transition cursor-pointer"
            >
              Place Order
            </button>
          </form>
        </div>
      </aside>
    </main>

    <footer
      class="bg-white border-t border-gray-200 py-4 text-center text-sm text-gray-500"
    >
      <p>Bole, Addis Ababa | &copy; 2026 Addis Eats</p>
      <div class="mt-2 space-x-4">
        <a href="#" class="hover:underline">Terms</a>
        <a href="#" class="hover:underline">Privacy</a>
        <a href="#" class="hover:underline">Contact</a>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
